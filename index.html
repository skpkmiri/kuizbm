<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>Juara Bahasa - SK Pendidikan Khas Miri</title>
  
  <!-- Google Fonts for Kid-Friendly Theme -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

  <style>
    /* Tema Font Kanak-Kanak */
    body {
      font-family: 'Fredoka', sans-serif;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      background-color: #1a1a1a; /* Latar belakang gelap di luar bingkai 16:9 */
    }

    /* Animasi Tersuai */
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in { animation: fade-in 0.3s ease-out; }
    
    @keyframes fade-in-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fade-in-up 0.3s ease-out; }

    /* Kesan Logo Bulat & Neon Bercahaya */
    @keyframes neon-pulse {
        0% { box-shadow: 0 0 10px #fff, 0 0 20px #ff00de, 0 0 30px #ff00de, 0 0 40px #ff00de; }
        100% { box-shadow: 0 0 15px #fff, 0 0 30px #ff00de, 0 0 45px #ff00de, 0 0 60px #ff00de; }
    }
    .logo-neon {
        border-radius: 50%;
        animation: neon-pulse 1.5s infinite alternate;
        background-color: white;
        padding: 8px;
        border: 6px solid #fff;
    }
    
    /* Buang scrollbar hodoh jika ada */
    ::-webkit-scrollbar {
      width: 8px;
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #d8b4fe; 
      border-radius: 10px;
    }
  </style>
</head>
<body>
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- TETAPAN FIREBASE (DENGAN SEMAKAN UNTUK MENGELAKKAN RALAT PENDUA) ---
    const firebaseConfig = {
      apiKey: "AIzaSyBatk_Lvyqqm_oD79AJNPCcZgmYQXGJy7I",
      authDomain: "kuizbm-13ef5.firebaseapp.com",
      projectId: "kuizbm-13ef5",
      storageBucket: "kuizbm-13ef5.firebasestorage.app",
      messagingSenderId: "295985841077",
      appId: "1:295985841077:web:0abfd11f5dfcd936234ffc",
      measurementId: "G-QTKZQ29P3T"
    };

    // Semak jika Firebase sudah dimulakan untuk elak 'Script error'
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();

    // --- KOMPONEN IKON ---
    const Star = ({ className, style }) => <svg className={className} style={style} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
    const Trophy = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>;
    const Play = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>;
    const Maximize = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>;
    const Sparkles = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>;
    const RefreshCw = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
    const UserPlus = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>;
    const Smile = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg>;
    const Check = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
    const X = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>;
    const ListOrdered = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="10" x2="21" y1="6" y2="6"/><line x1="10" x2="21" y1="12" y2="12"/><line x1="10" x2="21" y1="18" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg>;
    const ChevronLeft = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>;

    // --- DATA LALAI (Jika Firebase kosong) ---
    const defaultQuestions = {
      ejaan: {
        sederhana: [
          { soalan: "Mengeja 'Buku'", jawapan: "Buku", pilihan: ["Buku", "Baka", "Biku", "Beko"], emoji: "📖" },
          { soalan: "Mengeja 'Kereta'", jawapan: "Kereta", pilihan: ["Karata", "Kereta", "Kiriti", "Kuruta"], emoji: "🚗" },
        ],
        tinggi: [
          { soalan: "Mengeja 'Cemerlang'", jawapan: "Cemerlang", pilihan: ["Cemerlang", "Cemarlang", "Cemerleng", "Camarlang"], emoji: "🌟" }
        ]
      },
      bina_ayat: {
        sederhana: [
          { soalan: "Susun ayat: Ali suka buku", ayat: "Ali suka baca buku", perkataan: ["Ali", "suka", "baca", "buku"] }
        ],
        tinggi: [
          { soalan: "Susun ayat yang betul", ayat: "Saya pergi ke sekolah setiap hari", perkataan: ["Saya", "pergi", "ke", "sekolah", "setiap", "hari"] }
        ]
      }
    };

    function App() {
      // --- STATE PERMAINAN ---
      const [screen, setScreen] = useState('home'); 
      const [gameMode, setGameMode] = useState(''); 
      const [difficulty, setDifficulty] = useState('sederhana'); 
      const [players, setPlayers] = useState([]);
      const [newPlayerName, setNewPlayerName] = useState('');
      const [questions, setQuestions] = useState([]);
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [currentPlayerIndex, setCurrentPlayerIndex] = useState(0);
      const [scores, setScores] = useState({});
      const [selectedWords, setSelectedWords] = useState([]);
      const [availableWords, setAvailableWords] = useState([]);
      const [feedback, setFeedback] = useState(null); 
      
      // State untuk mesej pop-up
      const [toastMsg, setToastMsg] = useState(''); 

      // --- STATE FIREBASE ---
      const [isDbLoaded, setIsDbLoaded] = useState(false);
      const [dbQuestions, setDbQuestions] = useState(defaultQuestions);
      const [leaderboardData, setLeaderboardData] = useState([]);
      const [isSavingScores, setIsSavingScores] = useState(false);

      // --- SCALING LOGIC PINTAR (16:9 FIX) ---
      const [scale, setScale] = useState(1);
      
      useEffect(() => {
        const handleResize = () => {
          const width = window.innerWidth;
          const height = window.innerHeight;
          // Memastikan bingkai 1920x1080 sentiasa muat (fit) di tengah-tengah
          const scaleX = width / 1920;
          const scaleY = height / 1080;
          setScale(Math.min(scaleX, scaleY) * 0.95); // 0.95 beri sedikit margin selamat
        };
        
        window.addEventListener('resize', handleResize);
        handleResize(); // Init pada awal
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      // Ambil soalan dari Firebase
      const fetchQuestionsFromDB = async () => {
        try {
          const qSnapshot = await db.collection("questions").get();
          if (!qSnapshot.empty) {
             const tempQuestions = { ejaan: { sederhana: [], tinggi: [] }, bina_ayat: { sederhana: [], tinggi: [] } };
             qSnapshot.forEach((doc) => {
               const data = doc.data();
               if (tempQuestions[data.mode] && tempQuestions[data.mode][data.difficulty]) {
                 tempQuestions[data.mode][data.difficulty].push({ id: doc.id, ...data });
               }
             });
             setDbQuestions(tempQuestions);
          }
          setIsDbLoaded(true);
        } catch (error) { 
          console.error("Gagal Firebase soalan, guna lalai:", error); 
          setIsDbLoaded(true); // Teruskan dengan soalan lalai
        }
      };

      useEffect(() => {
        let unsubscribeLeaderboard;

        auth.signInAnonymously()
          .then(() => { 
            fetchQuestionsFromDB(); 
            
            // Baca data Senarai Juara secara MASA NYATA (Real-time).
            // Ini membolehkan markah dari kuiz_ejaan.html & Kuiz Bina ayat.html terus masuk ke sini.
            unsubscribeLeaderboard = db.collection("leaderboard").onSnapshot((snapshot) => {
              const tempLeaderboard = [];
              snapshot.forEach((doc) => tempLeaderboard.push({ id: doc.id, ...doc.data() }));
              tempLeaderboard.sort((a, b) => (b.markah || 0) - (a.markah || 0));
              setLeaderboardData(tempLeaderboard);
            }, (error) => {
              console.error("Ralat onSnapshot senarai juara:", error);
            });
          })
          .catch((error) => {
             console.error("Ralat Auth, guna lalai:", error);
             setIsDbLoaded(true);
          });

        // Bersihkan pendengar pangkalan data (memory leak) apabila komponen ditutup
        return () => {
          if (unsubscribeLeaderboard) unsubscribeLeaderboard();
        };
      }, []);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      const toggleFullScreen = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => console.log(err));
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
        }
      };

      const shuffleArray = (array) => {
        const shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
      };

      const startGameSetup = (mode) => { setGameMode(mode); setScreen('setup'); };

      const addPlayer = () => {
        if (newPlayerName.trim() !== '') {
          if (players.includes(newPlayerName.trim())) {
             showToast("Nama pemain sudah wujud!");
             return;
          }
          setPlayers([...players, newPlayerName.trim()]);
          setScores({ ...scores, [newPlayerName.trim()]: 0 });
          setNewPlayerName('');
        }
      };

      const removePlayer = (index) => {
        const newPlayers = [...players];
        const removedPlayer = newPlayers.splice(index, 1)[0];
        setPlayers(newPlayers);
        const newScores = { ...scores };
        delete newScores[removedPlayer];
        setScores(newScores);
      };

      const startQuiz = () => {
        if (players.length === 0) return showToast("Sila masukkan sekurang-kurangnya satu nama murid!");
        
        let selectedQuestions = shuffleArray(dbQuestions[gameMode][difficulty] || []);
        if (selectedQuestions.length === 0) return showToast("Belum ada soalan untuk tahap ini.");

        setQuestions(selectedQuestions);
        setCurrentQIndex(0);
        setCurrentPlayerIndex(0);
        if (gameMode === 'bina_ayat' && selectedQuestions.length > 0) {
          setAvailableWords(shuffleArray(selectedQuestions[0].perkataan));
          setSelectedWords([]);
        }
        setScreen('play');
      };

      const handleEjaanAnswer = (jawapanPilih) => {
        const isCorrect = jawapanPilih === questions[currentQIndex].jawapan;
        processAnswer(isCorrect);
      };

      const handleWordSelect = (word, index) => {
        const newAvailable = [...availableWords];
        newAvailable.splice(index, 1);
        setAvailableWords(newAvailable);
        setSelectedWords([...selectedWords, word]);
      };

      const handleWordDeselect = (word, index) => {
        const newSelected = [...selectedWords];
        newSelected.splice(index, 1);
        setSelectedWords(newSelected);
        setAvailableWords([...availableWords, word]);
      };

      const checkBinaAyat = () => {
        const userAyat = selectedWords.join(" ");
        const isCorrect = userAyat.toLowerCase() === questions[currentQIndex].ayat.toLowerCase();
        processAnswer(isCorrect);
      };

      const processAnswer = (isCorrect) => {
        if (isCorrect) {
          setFeedback('correct');
          const currentPlayer = players[currentPlayerIndex];
          setScores(prev => ({ ...prev, [currentPlayer]: prev[currentPlayer] + 1 }));
        } else {
          setFeedback('wrong');
        }
        setTimeout(() => { setFeedback(null); nextTurn(); }, 2000);
      };

      const nextTurn = () => {
        const nextQIndex = currentQIndex + 1;
        if (nextQIndex < questions.length) {
          setCurrentQIndex(nextQIndex);
          setCurrentPlayerIndex((currentPlayerIndex + 1) % players.length);
          if (gameMode === 'bina_ayat') {
            setAvailableWords(shuffleArray(questions[nextQIndex].perkataan));
            setSelectedWords([]);
          }
        } else {
          saveScoresToDB();
        }
      };

      const saveScoresToDB = async () => {
        setIsSavingScores(true);
        setScreen('result');
        try {
          const tarikh = new Date().toLocaleDateString('ms-MY');
          for (const player of players) {
             // Elak simpan data mock ke db, pastikan ada sambungan auth
             if(auth.currentUser) {
                await db.collection("leaderboard").add({
                  nama: player, markah: scores[player], mod: gameMode,
                  tahap: difficulty, tarikh: tarikh, timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
             }
          }
          // Data akan di-kemaskini secara automatik di papan skor (melalui fungsi onSnapshot)
        } catch (error) { console.error("Ralat menyimpan markah: ", error); }
        setIsSavingScores(false);
      };

      const resetGame = () => { setScreen('home'); setPlayers([]); setScores({}); setNewPlayerName(''); };


      // Komponen Paparan Notifikasi (Toast)
      const Toast = () => {
        if (!toastMsg) return null;
        return (
          <div className="absolute top-12 left-1/2 transform -translate-x-1/2 z-[999] bg-red-500 text-white px-10 py-5 rounded-full text-4xl font-black shadow-2xl animate-fade-in-up border-8 border-white whitespace-nowrap">
            {toastMsg}
          </div>
        );
      }

      const HomeUI = () => (
        <div className="flex flex-row items-center justify-between w-full h-full bg-gradient-to-br from-yellow-300 via-pink-300 to-cyan-300 px-24 py-16 relative overflow-hidden">
          
          {/* Hiasan Latar Belakang Buih Bergerak */}
          <div className="absolute inset-0 opacity-40 pointer-events-none z-0">
             {[...Array(20)].map((_, i) => (
                <div key={i} className="absolute bg-white rounded-full opacity-60 animate-bounce" style={{
                   width: `${Math.random() * 100 + 50}px`,
                   height: `${Math.random() * 100 + 50}px`,
                   left: `${Math.random() * 100}%`,
                   top: `${Math.random() * 100}%`,
                   animationDuration: `${Math.random() * 3 + 2}s`,
                   animationDelay: `${Math.random() * 2}s`
                }}></div>
             ))}
          </div>

          {!isDbLoaded && (
            <div className="absolute top-8 left-1/2 transform -translate-x-1/2 bg-white/90 text-pink-600 px-8 py-4 rounded-full text-3xl font-black flex items-center gap-3 animate-pulse z-50 shadow-xl border-4 border-pink-400">
              <RefreshCw className="w-10 h-10 animate-spin" /> Menyambung...
            </div>
          )}

          <div className="absolute top-16 left-1/2 transform -translate-x-1/2 flex space-x-32 animate-bounce z-10 pointer-events-none opacity-60">
            <Star className="text-yellow-400 w-28 h-28 fill-yellow-400 drop-shadow-2xl" />
            <Sparkles className="text-white w-28 h-28 drop-shadow-2xl" />
            <Star className="text-yellow-400 w-28 h-28 fill-yellow-400 drop-shadow-2xl" />
          </div>
          
          {/* BAHAGIAN KIRI: GRID TAJUK & LOGO */}
          <div className="w-[48%] h-full flex flex-col justify-center items-center z-10 relative">
            <div className="bg-white/60 backdrop-blur-xl p-16 rounded-[4rem] shadow-2xl border-8 border-white text-center transform hover:scale-105 transition-transform duration-500 flex flex-col items-center w-full">
              
              {/* Logo Neon Bulat */}
              <div className="mb-12 relative">
                 <img src="logo.png" alt="Logo SKPK" className="w-64 h-64 object-cover logo-neon z-20 relative" 
                   onError={(e) => {
                     e.target.onerror = null; 
                     e.target.src = 'https://placehold.co/300x300/e879f9/ffffff?text=LOGO';
                   }} />
              </div>

              <h1 className="text-[130px] font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-600 drop-shadow-md mb-4 leading-tight">
                JUARA<br/>BAHASA
              </h1>
              <p className="text-4xl font-black text-white bg-gradient-to-r from-cyan-400 to-blue-500 rounded-full px-12 py-5 inline-block shadow-[0_8px_0_0_#0284c7] mt-8 border-4 border-white tracking-wide">
                SK Pendidikan Khas Miri
              </p>
            </div>
          </div>

          {/* BAHAGIAN KANAN: GRID MENU */}
          <div className="w-[45%] h-full flex flex-col justify-center gap-10 z-10">
            
            {/* Butang Kuiz Ejaan (Atas) */}
            <button 
              onClick={() => window.location.href = 'kuiz_ejaan.html'}
              className="group relative w-full bg-gradient-to-r from-yellow-300 to-orange-400 rounded-[3rem] p-10 border-b-[16px] border-orange-600 active:border-b-0 active:translate-y-4 transition-all shadow-2xl border-x-4 border-t-4 border-white flex items-center gap-12"
            >
              <div className="bg-white/40 rounded-full w-40 h-40 flex items-center justify-center group-hover:animate-bounce shadow-inner border-4 border-white/50 flex-shrink-0">
                <span className="text-[90px] block leading-none">🔤</span>
              </div>
              <div className="flex flex-col items-start">
                <span className="text-6xl font-black text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.4)] tracking-wider">KUIZ EJAAN</span>
                <span className="text-3xl font-bold text-orange-800/70 mt-2">Uji kemahiran mengeja!</span>
              </div>
            </button>

            {/* Butang Kuiz Bina Ayat (Bawah) */}
            <button 
              onClick={() => window.location.href = 'Kuiz Bina ayat.html'}
              className="group relative w-full bg-gradient-to-r from-green-300 to-emerald-500 rounded-[3rem] p-10 border-b-[16px] border-emerald-700 active:border-b-0 active:translate-y-4 transition-all shadow-2xl border-x-4 border-t-4 border-white flex items-center gap-12"
            >
              <div className="bg-white/40 rounded-full w-40 h-40 flex items-center justify-center group-hover:animate-bounce shadow-inner border-4 border-white/50 flex-shrink-0">
                <span className="text-[90px] block leading-none">🧩</span>
              </div>
              <div className="flex flex-col items-start">
                <span className="text-6xl font-black text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.4)] tracking-wider">KUIZ AYAT</span>
                <span className="text-3xl font-bold text-emerald-900/60 mt-2">Sempurnakan ayat!</span>
              </div>
            </button>

            {/* Butang Senarai Juara (Paling Bawah) */}
            <button 
              onClick={() => setScreen('leaderboard')} 
              className="group relative w-full bg-gradient-to-r from-purple-500 to-indigo-500 rounded-[3rem] p-10 border-b-[16px] border-indigo-800 active:border-b-0 active:translate-y-4 transition-all shadow-2xl border-x-4 border-t-4 border-white flex items-center gap-12 mt-6"
            >
              <div className="bg-white/40 rounded-full w-40 h-40 flex items-center justify-center group-hover:animate-bounce shadow-inner border-4 border-white/50 flex-shrink-0">
                <Trophy className="w-24 h-24 text-yellow-300 drop-shadow-[0_4px_4px_rgba(0,0,0,0.3)]" />
              </div>
              <div className="flex flex-col items-start">
                <span className="text-6xl font-black text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.4)] tracking-wider">SENARAI JUARA</span>
                <span className="text-3xl font-bold text-indigo-900/60 mt-2">Lihat rekod pemenang!</span>
              </div>
            </button>

          </div>
        </div>
      );

      const SetupUI = () => (
        <div className="flex flex-col items-center w-full h-full bg-gradient-to-b from-orange-200 to-yellow-200 p-12">
          <h2 className="text-[90px] font-black text-orange-600 mt-12 mb-12 drop-shadow-sm text-center">
            {gameMode === 'ejaan' ? 'KUIZ EJAAN' : 'KUIZ BINA AYAT'}
          </h2>

          <div className="bg-white rounded-[4rem] shadow-2xl p-16 w-full max-w-5xl border-[12px] border-orange-400 mb-12">
            <h3 className="text-6xl font-black text-gray-700 mb-10 flex items-center justify-center gap-4">
              <UserPlus className="text-blue-500 w-16 h-16" /> Senarai Peserta (Giliran)
            </h3>
            
            <div className="flex gap-6 mb-10 w-full">
              <input 
                type="text" 
                value={newPlayerName}
                onChange={(e) => setNewPlayerName(e.target.value)}
                onKeyPress={(e) => e.key === 'Enter' && addPlayer()}
                placeholder="Nama Murid..." 
                className="flex-1 text-5xl p-8 rounded-[2rem] border-[6px] border-blue-200 focus:border-blue-500 outline-none font-bold text-gray-700 w-full"
              />
              <button 
                onClick={addPlayer}
                className="bg-blue-500 hover:bg-blue-600 text-white text-5xl font-black px-14 py-8 rounded-[2rem] shadow-[0_10px_0_0_#1d4ed8] active:shadow-none active:translate-y-3 transition-all"
              >
                TAMBAH
              </button>
            </div>

            <div className="flex flex-wrap gap-6 min-h-[120px]">
              {players.map((player, idx) => (
                <div key={idx} className="bg-pink-100 border-[6px] border-pink-400 rounded-full px-10 py-5 flex items-center gap-6 text-5xl font-bold text-pink-700 animate-fade-in-up">
                  {idx + 1}. {player}
                  <button onClick={() => removePlayer(idx)} className="bg-pink-500 text-white rounded-full p-3 hover:bg-pink-600 flex items-center justify-center shadow-md">
                    <X className="w-10 h-10" />
                  </button>
                </div>
              ))}
              {players.length === 0 && <p className="text-4xl text-gray-400 italic w-full text-center mt-6">Belum ada peserta dimasukkan.</p>}
            </div>
          </div>

          <div className="bg-white rounded-[4rem] shadow-2xl p-16 w-full max-w-5xl border-[12px] border-orange-400 mb-12">
             <h3 className="text-6xl font-black text-gray-700 mb-10 text-center">Pilih Tahap</h3>
             <div className="flex gap-8">
                <button 
                  onClick={() => setDifficulty('sederhana')}
                  className={`flex-1 text-5xl font-black py-10 rounded-[2rem] transition-all border-b-[12px] ${difficulty === 'sederhana' ? 'bg-green-400 text-white border-green-600 shadow-inner translate-y-3 border-b-0' : 'bg-green-100 text-green-700 border-green-400 hover:bg-green-200 shadow-lg'}`}
                >
                  SEDERHANA
                </button>
                <button 
                  onClick={() => setDifficulty('tinggi')}
                  className={`flex-1 text-5xl font-black py-10 rounded-[2rem] transition-all border-b-[12px] ${difficulty === 'tinggi' ? 'bg-red-400 text-white border-red-600 shadow-inner translate-y-3 border-b-0' : 'bg-red-100 text-red-700 border-red-400 hover:bg-red-200 shadow-lg'}`}
                >
                  TINGGI
                </button>
             </div>
          </div>

          <div className="flex gap-10">
            <button onClick={() => setScreen('home')} className="bg-gray-400 hover:bg-gray-500 text-white text-5xl font-black px-16 py-8 rounded-[2.5rem] shadow-[0_10px_0_0_#4b5563] active:shadow-none active:translate-y-3 transition-all">
              KEMBALI
            </button>
            <button 
              onClick={startQuiz}
              className={`flex items-center justify-center gap-6 text-6xl font-black px-20 py-8 rounded-[2.5rem] transition-all ${players.length > 0 ? 'bg-yellow-400 hover:bg-yellow-500 text-yellow-900 shadow-[0_12px_0_0_#b45309] active:shadow-none active:translate-y-3 cursor-pointer border-4 border-white' : 'bg-gray-200 text-gray-400 cursor-not-allowed border-b-8 border-gray-300'}`}
            >
              MULA KUIZ! <Play className="w-16 h-16" />
            </button>
          </div>
        </div>
      );

      const FeedbackOverlay = () => {
        if (!feedback) return null;
        return (
          <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center rounded-[4rem]">
            {feedback === 'correct' ? (
              <div className="bg-green-400 rounded-[4rem] p-24 animate-bounce border-[12px] border-white shadow-2xl flex flex-col items-center">
                <Check className="text-white w-64 h-64" />
                <span className="text-[90px] font-black text-white mt-8 drop-shadow-md">PANDAI!</span>
              </div>
            ) : (
              <div className="bg-red-500 rounded-[4rem] p-24 animate-pulse border-[12px] border-white shadow-2xl flex flex-col items-center">
                <X className="text-white w-64 h-64" />
                <span className="text-[90px] font-black text-white mt-8 drop-shadow-md">CUBA LAGI!</span>
              </div>
            )}
          </div>
        );
      };

      const LeaderboardUI = () => {
        // Asingkan data mengikut mod permainan dari pangkalan data (Sokongan lebih baik untuk fail luaran)
        const ejaanData = leaderboardData.filter(r => {
          const modStr = String(r.mod || r.mode || r.gameMode || "").toLowerCase();
          return modStr.includes('ejaan');
        });
        
        const binaAyatData = leaderboardData.filter(r => {
          const modStr = String(r.mod || r.mode || r.gameMode || "").toLowerCase();
          return modStr.includes('ayat') || modStr.includes('bina');
        });

        // Komponen jadual mini untuk dipaparkan sebelah menyebelah
        const TableJuara = ({ data, tajuk, ikon, warnaBorder, warnaTeks }) => (
          <div className={`flex-1 bg-white/10 backdrop-blur-xl p-8 rounded-[3rem] border-[8px] ${warnaBorder} shadow-2xl flex flex-col`}>
            <div className={`flex items-center justify-center gap-6 border-b-[8px] ${warnaBorder.replace('/80', '/40')} pb-6 mb-6`}>
              <span className="text-[60px]">{ikon}</span>
              <h3 className={`text-5xl font-black ${warnaTeks} drop-shadow-md tracking-wider uppercase`}>{tajuk}</h3>
            </div>
            
            <div className="flex-1 overflow-y-auto custom-scrollbar pr-4">
              {data.length === 0 ? (
                <p className="text-center text-4xl text-white/50 italic font-bold mt-12">Belum ada rekod juara.</p>
              ) : (
                <table className="w-full text-4xl">
                  <thead>
                    <tr className="border-b-[6px] border-white/20 text-white/80">
                      <th className="py-6 text-left text-4xl font-black w-32">Ked.</th>
                      <th className="py-6 text-left text-4xl font-black">Nama Juara</th>
                      <th className="py-6 text-center text-4xl font-black w-48">Markah</th>
                    </tr>
                  </thead>
                  <tbody>
                    {data.map((rekod, idx) => (
                      <tr key={idx} className="border-b-[3px] border-white/10 hover:bg-white/20 transition-colors">
                        <td className="py-6 font-black text-yellow-300 text-5xl">#{idx + 1}</td>
                        <td className="py-6">
                          <div className="font-black text-5xl">{rekod.nama.toUpperCase()}</div>
                          {rekod.tahap && (
                            <div className="text-2xl text-white/60 mt-1 font-bold">
                              Tahap: {rekod.tahap.charAt(0).toUpperCase() + rekod.tahap.slice(1)}
                            </div>
                          )}
                        </td>
                        <td className="py-6 text-center font-black text-green-300 text-5xl flex items-center justify-center gap-2 h-full">
                          {rekod.markah} <Star className="w-10 h-10 fill-green-300 text-green-300"/>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          </div>
        );

        return (
          <div className="flex flex-col items-center w-full h-full bg-gradient-to-b from-indigo-500 to-purple-800 p-12 text-white relative">
            <h2 className="text-[90px] font-black mt-8 mb-10 text-yellow-300 drop-shadow-2xl flex items-center justify-center gap-8 w-full">
              <Trophy className="w-24 h-24" /> SENARAI JUARA KESELURUHAN
            </h2>

            {/* Grid 2 Lajur (Kiri: Ejaan, Kanan: Bina Ayat) */}
            <div className="flex w-full max-w-[1750px] gap-10 mb-12 h-[60vh]">
              <TableJuara 
                data={ejaanData} 
                tajuk="KUIZ EJAAN" 
                ikon="🔤" 
                warnaBorder="border-orange-400/80" 
                warnaTeks="text-orange-300"
              />
              <TableJuara 
                data={binaAyatData} 
                tajuk="KUIZ AYAT" 
                ikon="🧩" 
                warnaBorder="border-emerald-400/80" 
                warnaTeks="text-emerald-300"
              />
            </div>

            <button onClick={() => setScreen('home')} className="bg-purple-900 hover:bg-purple-950 text-white px-16 py-8 rounded-full text-5xl font-black shadow-[0_10px_0_0_#2e1065] active:shadow-none active:translate-y-3 flex items-center transition-all border-4 border-purple-400">
              <ChevronLeft className="w-16 h-16 mr-4" /> KEMBALI KE MENU UTAMA
            </button>
          </div>
        );
      };

      return (
        <div className="flex items-center justify-center w-screen h-screen bg-[#111] overflow-hidden m-0 p-0 font-['Fredoka']">
          <Toast />

          {/* BEKAS UTAMA - Sentiasa 1920x1080 (Skrin 16:9), Dibingkaikan kemas untuk rupa seperti Tablet/Papan Pintar */}
          <div 
            style={{ 
              width: '1920px', 
              height: '1080px', 
              transform: `scale(${scale})`,
              transformOrigin: 'center center'
            }} 
            className="relative bg-gray-100 shadow-[0_0_100px_rgba(0,0,0,0.9)] flex-shrink-0 overflow-hidden rounded-[60px] border-[24px] border-gray-900 ring-[12px] ring-gray-700"
          >
            <button 
              onClick={toggleFullScreen}
              className="absolute top-12 right-12 z-[100] bg-white/40 hover:bg-white/80 text-gray-900 p-8 rounded-full backdrop-blur-md transition-all shadow-xl border-4 border-white"
              title="Skrin Penuh"
            >
              <Maximize className="w-14 h-14" />
            </button>
            
            {screen === 'home' && <HomeUI />}
            {screen === 'setup' && <SetupUI />}
            {screen === 'play' && gameMode === 'ejaan' && <QuizEjaanUI />}
            {screen === 'play' && gameMode === 'bina_ayat' && <QuizBinaAyatUI />}
            {screen === 'result' && <ResultUI />}
            {screen === 'leaderboard' && <LeaderboardUI />}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
