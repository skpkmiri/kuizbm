  <!-- Audio Synthesizer BGM Script using Web Audio API -->
  <script>
    class BackgroundMusic {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.timer = null;
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }

      play() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.isPlaying = true;
        
        const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
        let step = 0;

        const playNextNote = () => {
          if (!this.isPlaying) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          const noteFreq = notes[step % notes.length];
          osc.frequency.setValueAtTime(noteFreq, this.ctx.currentTime);

          gain.gain.setValueAtTime(0, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.05, this.ctx.currentTime + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.6);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + 0.6);

          step = (step + Math.floor(Math.random() * 2) + 1) % notes.length;
          this.timer = setTimeout(playNextNote, 400);
        };

        playNextNote();
      }

      stop() {
        this.isPlaying = false;
        if (this.timer) clearTimeout(this.timer);
      }
    }
    window.bgMusic = new BackgroundMusic();
  </script>

        const wordObj = isP1 ? WORDS_P1[state.wordIdx] : WORDS_P2[state.wordIdx];
        
        let isCorrect = false;
        if (!isTimeout) isCorrect = state.input.trim().toLowerCase() === wordObj.word.toLowerCase();

          const newStudents = [...prev];
          newStudents[studentGlobalIdx] = {
            ...newStudents[studentGlobalIdx],
            score: isCorrect ? newStudents[studentGlobalIdx].score + 2 : newStudents[studentGlobalIdx].score,
            history: [...newStudents[studentGlobalIdx].history, isCorrect ? 2 : 'X']
          };
          return newStudents;
        });

        const setLocalState = isP1 ? setP1State : setP2State;
        setLocalState(prev => ({ ...prev, feedback: isTimeout ? 'timeout' : (isCorrect ? 'correct' : 'wrong') }));

          setLocalState(prev => {
            const nextWordIdx = prev.wordIdx + 1;
            if (nextWordIdx >= 15) return { ...prev, isFinished: true, feedback: null };

              ...prev,
              wordIdx: nextWordIdx,
              studentIdxInList: (prev.studentIdxInList + 1) % 3,
              timeLeft: TIME_PER_TURN,
              input: '',
              feedback: null

                            {p1State.feedback === 'correct' ? (
                              <>
                                <div className="bg-green-100 p-4 lg:p-6 rounded-full mb-2 lg:mb-4 animate-bounce"><Icon d={ICONS.check} className="w-16 h-16 lg:w-24 lg:h-24" /></div>
                                <h2 className="text-4xl lg:text-5xl font-black mb-2">PANDAI!</h2>
                                <p className="text-xl lg:text-2xl font-bold bg-green-500 text-white px-4 lg:px-6 py-1 lg:py-2 rounded-full">+2 Markah</p>
                              </>
                            ) : p1State.feedback === 'timeout' ? (
                              <>
                                <div className="bg-orange-100 p-4 lg:p-6 rounded-full mb-2 lg:mb-4"><Icon d={ICONS.clock} className="w-16 h-16 lg:w-24 lg:h-24 text-orange-500" /></div>
                                <h2 className="text-3xl lg:text-5xl font-black mb-2 text-orange-500">MASA TAMAT!</h2>
                                <p className="text-xl lg:text-2xl font-bold text-slate-700">Jawapan: <span className="text-blue-600 text-3xl lg:text-4xl">{word1.word}</span></p>
                              </>
                            ) : (
                              <>
                                <div className="bg-red-100 p-4 lg:p-6 rounded-full mb-2 lg:mb-4"><Icon d={ICONS.x} className="w-16 h-16 lg:w-24 lg:h-24" /></div>
                                <h2 className="text-3xl lg:text-5xl font-black mb-2">CUBA LAGI!</h2>
                                <p className="text-xl lg:text-2xl font-bold text-slate-700">Jawapan: <span className="text-blue-600 text-3xl lg:text-4xl">{word1.word}</span></p>
                              </>
                            )}
                          </div>
                        )}

                        {renderTimerBar(p1State.timeLeft, 'blue')}

                        <div className="w-full flex justify-between items-center mb-1 gap-1">
                           <span className="bg-blue-200 text-blue-800 px-2 lg:px-3 py-1 rounded-xl font-bold whitespace-nowrap shadow-sm text-xs lg:text-sm">S: {p1State.wordIdx + 1}/15</span>
                           <div className="bg-blue-600 text-white px-3 lg:px-4 py-1 rounded-xl font-black text-base lg:text-xl flex-1 text-center shadow-sm truncate">{activeStudent1.name}</div>
                        </div>
                        
                        <div className="flex justify-center my-1 lg:my-2 w-full">
                          <div className="bg-white border-2 lg:border-4 border-dashed border-blue-300 rounded-[1rem] p-2 inline-block shadow-sm pointer-events-none">
                            <div className="text-[50px] lg:text-[60px] leading-none drop-shadow-xl">{word1.emoji}</div>
                          </div>
                        </div>

                        <div className="flex justify-center mb-1 w-full">
                          <button onPointerDown={withInstantTouch(() => speakWord(word1.word))} className="bg-cyan-400 text-cyan-950 px-4 py-1 lg:py-2 rounded-full text-sm lg:text-base font-black shadow-[0_3px_0_0_rgba(6,182,212,1)] active:translate-y-1 flex items-center gap-1 lg:gap-2 border-2 border-cyan-200 touch-manipulation">
                            <Icon d={ICONS.volOn} className="w-4 h-4 lg:w-5 lg:h-5" /> DENGAR
                          </button>
                        </div>

                        <input type="text" value={p1State.input} readOnly placeholder="EJA..." className="w-full text-center text-xl lg:text-3xl font-black py-1 lg:py-2 rounded-xl border-2 lg:border-4 border-blue-300 outline-none mb-1 lg:mb-2 uppercase tracking-[0.2em] text-slate-700 shadow-inner bg-white pointer-events-none" />

                        {renderKeyboard('p1', 'blue')}
                      </div>

                      {/* Butang HANTAR dikunci di bawah luar dari Scroll Area */}
                      <button 
                        onPointerDown={withInstantTouch(() => { if(p1State.input.trim() && !p1State.feedback) handleAnswer('p1'); })}
                        disabled={!p1State.input.trim() || p1State.feedback !== null}
                        className="mt-2 w-full bg-green-500 disabled:bg-slate-300 text-white text-lg lg:text-2xl font-black py-2 lg:py-3 rounded-xl shadow-[0_4px_0_0_rgba(21,128,61,1)] active:shadow-none active:translate-y-1 disabled:shadow-none transition-all touch-manipulation shrink-0"
                      >
                        HANTAR
                      </button>
                    </>
                  )}
                </div>

                {/* ----------------- SCOREBOARD ZONE (TENGAH) ----------------- */}
                <div className="w-[20%] bg-yellow-50 rounded-[1.5rem] lg:rounded-[2rem] border-4 lg:border-8 border-yellow-300 p-2 flex flex-col items-center min-h-0">
                  <h2 className="text-base lg:text-xl font-black text-amber-700 mb-2 flex flex-col items-center gap-1 text-center w-full pb-2 border-b-2 border-yellow-200">
                    <Icon d={ICONS.trophy} className="w-5 h-5 lg:w-8 lg:h-8 text-yellow-500" />
                    MARKAH
                  </h2>
                  
                  <div className="flex-1 w-full flex flex-col gap-1 lg:gap-2 overflow-y-auto custom-scrollbar pr-1">
                    {sortedStudents.map((student, index) => (
                      <div key={student.id} className={`bg-white rounded-xl p-1 lg:p-2 border-2 flex flex-col items-center text-center transition-all ${(student.id === activeStudent1.id && !p1State.isFinished) || (student.id === activeStudent2.id && !p2State.isFinished) ? 'border-orange-400 bg-orange-50 scale-[1.02]' : 'border-yellow-100'}`}>
                        <div className={`w-4 h-4 lg:w-6 lg:h-6 rounded-full flex items-center justify-center font-black text-white mb-1 text-[10px] lg:text-sm ${index === 0 ? 'bg-yellow-400' : index === 1 ? 'bg-slate-400' : index === 2 ? 'bg-amber-600' : 'bg-slate-200'}`}>{index + 1}</div>
                        <span className="font-bold text-[10px] lg:text-sm text-slate-700 leading-tight">{student.name}</span>
                        <span className="font-black text-base lg:text-xl text-orange-600">{student.score}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* ----------------- PLAYER 2 ZONE (KANAN) ----------------- */}
                <div className="w-[40%] bg-pink-50 rounded-[1.5rem] lg:rounded-[2rem] border-4 lg:border-8 border-pink-200 relative flex flex-col p-2 overflow-hidden min-h-0">
                  {p2State.isFinished ? (
                    <div className="flex-1 flex flex-col items-center justify-center text-center animate-pulse">
                      <div className="bg-pink-100 p-6 rounded-full mb-4"><Icon d={ICONS.check} className="w-16 h-16 lg:w-20 lg:h-20 text-pink-500" /></div>
                      <h2 className="text-3xl lg:text-4xl font-black text-pink-600 mb-2">HEBAT!</h2>
                      <p className="text-lg lg:text-xl font-bold text-slate-500">Menunggu rakan di sebelah...</p>
                    </div>
                  ) : (
                    <>
                      {/* Flex-1 Scrollable Area */}
                      <div className="flex-1 w-full flex flex-col min-h-0 overflow-y-auto overflow-x-hidden custom-scrollbar pr-1 pb-1">
                        
                        {p2State.feedback && (
                          <div className={`absolute inset-0 z-50 flex flex-col items-center justify-center backdrop-blur-sm bg-white/95 ${p2State.feedback === 'correct' ? 'text-green-500' : 'text-red-500'}`}>
                            {p2State.feedback === 'correct' ? (
                              <>
                                <div className="bg-green-100 p-4 lg:p-6 rounded-full mb-2 lg:mb-4 animate-bounce"><Icon d={ICONS.check} className="w-16 h-16 lg:w-24 lg:h-24" /></div>
                                <h2 className="text-4xl lg:text-5xl font-black mb-2">PANDAI!</h2>
                                <p className="text-xl lg:text-2xl font-bold bg-green-500 text-white px-4 lg:px-6 py-1 lg:py-2 rounded-full">+2 Markah</p>
                              </>
                            ) : p2State.feedback === 'timeout' ? (
                              <>
                                <div className="bg-orange-100 p-4 lg:p-6 rounded-full mb-2 lg:mb-4"><Icon d={ICONS.clock} className="w-16 h-16 lg:w-24 lg:h-24 text-orange-500" /></div>
                                <h2 className="text-3xl lg:text-5xl font-black mb-2 text-orange-500">MASA TAMAT!</h2>
                                <p className="text-xl lg:text-2xl font-bold text-slate-700">Jawapan: <span className="text-pink-600 text-3xl lg:text-4xl">{word2.word}</span></p>
                              </>
                            ) : (
                              <>
                                <div className="bg-red-100 p-4 lg:p-6 rounded-full mb-2 lg:mb-4"><Icon d={ICONS.x} className="w-16 h-16 lg:w-24 lg:h-24" /></div>
                                <h2 className="text-3xl lg:text-5xl font-black mb-2">CUBA LAGI!</h2>
                                <p className="text-xl lg:text-2xl font-bold text-slate-700">Jawapan: <span className="text-pink-600 text-3xl lg:text-4xl">{word2.word}</span></p>
                              </>
                            )}
                          </div>
                        )}

                        {renderTimerBar(p2State.timeLeft, 'pink')}

                        <div className="w-full flex justify-between items-center mb-1 gap-1">
                           <span className="bg-pink-200 text-pink-800 px-2 lg:px-3 py-1 rounded-xl font-bold whitespace-nowrap shadow-sm text-xs lg:text-sm">S: {p2State.wordIdx + 1}/15</span>
                           <div className="bg-pink-500 text-white px-3 lg:px-4 py-1 rounded-xl font-black text-base lg:text-xl flex-1 text-center shadow-sm truncate">{activeStudent2.name}</div>
                        </div>
                        
                        <div className="flex justify-center my-1 lg:my-2 w-full">
                          <div className="bg-white border-2 lg:border-4 border-dashed border-pink-300 rounded-[1rem] p-2 inline-block shadow-sm pointer-events-none">
                            <div className="text-[50px] lg:text-[60px] leading-none drop-shadow-xl">{word2.emoji}</div>
                          </div>
                        </div>

                        <div className="flex justify-center mb-1 w-full">
                          <button onPointerDown={withInstantTouch(() => speakWord(word2.word))} className="bg-cyan-400 text-cyan-950 px-4 py-1 lg:py-2 rounded-full text-sm lg:text-base font-black shadow-[0_3px_0_0_rgba(6,182,212,1)] active:translate-y-1 flex items-center gap-1 lg:gap-2 border-2 border-cyan-200 touch-manipulation">
                            <Icon d={ICONS.volOn} className="w-4 h-4 lg:w-5 lg:h-5" /> DENGAR
                          </button>
                        </div>

                        <input type="text" value={p2State.input} readOnly placeholder="EJA..." className="w-full text-center text-xl lg:text-3xl font-black py-1 lg:py-2 rounded-xl border-2 lg:border-4 border-pink-300 outline-none mb-1 lg:mb-2 uppercase tracking-[0.2em] text-slate-700 shadow-inner bg-white pointer-events-none" />

                        {renderKeyboard('p2', 'pink')}
                      </div>

                      {/* Butang HANTAR dikunci di bawah luar dari Scroll Area */}
                      <button 
                        onPointerDown={withInstantTouch(() => { if(p2State.input.trim() && !p2State.feedback) handleAnswer('p2'); })}
                        disabled={!p2State.input.trim() || p2State.feedback !== null}
                        className="mt-2 w-full bg-green-500 disabled:bg-slate-300 text-white text-lg lg:text-2xl font-black py-2 lg:py-3 rounded-xl shadow-[0_4px_0_0_rgba(21,128,61,1)] active:shadow-none active:translate-y-1 disabled:shadow-none transition-all touch-manipulation shrink-0"
                      >
                        HANTAR
                      </button>
                    </>
                  )}
                </div>
              </>
            )}

            {/* ----------------- PODIUM SHOWCASE (AKHIR) ----------------- */}
            {gameState === 'ended' && (
              <div className="w-full bg-white/95 rounded-[2rem] border-4 border-white h-full flex flex-col justify-center items-center p-6 text-center overflow-y-auto">
                <div className="z-10 flex flex-col items-center w-full max-w-4xl">
                  
                  <h2 className="text-3xl lg:text-5xl font-black mb-6 text-purple-600 drop-shadow-md">🏆 PEMENANG 🏆</h2>

                  <div className="flex justify-center items-end gap-2 lg:gap-6 mb-6 h-48 lg:h-64 w-full">
                    <div className="flex flex-col items-center flex-1">
                      <span className="text-base lg:text-xl font-black text-slate-700 mb-1">{sortedStudents[1].name}</span>
                      <div className="bg-gradient-to-b from-slate-200 to-slate-400 w-full h-24 lg:h-32 rounded-t-2xl border-2 border-slate-300 flex flex-col items-center justify-center shadow-lg relative">
                        <span className="text-3xl lg:text-5xl font-black text-white">2</span>
                        <span className="text-xs lg:text-base font-bold text-slate-800 bg-white/80 px-2 py-1 rounded-full mt-1">{sortedStudents[1].score}m</span>
                      </div>
                    </div>

                    <div className="flex flex-col items-center flex-1">
                      <div className="bg-yellow-100 p-1 lg:p-2 rounded-full mb-1 animate-bounce">
                        <Icon d={ICONS.trophy} className="w-8 h-8 lg:w-12 lg:h-12 text-yellow-500 fill-yellow-400" />
                      </div>
                      <span className="text-xl lg:text-2xl font-black text-amber-600 mb-1">{sortedStudents[0].name}</span>
                      <div className="bg-gradient-to-b from-yellow-300 to-amber-500 w-full h-36 lg:h-48 rounded-t-2xl border-2 border-yellow-200 flex flex-col items-center justify-center shadow-2xl relative z-10">
                        <span className="text-5xl lg:text-6xl font-black text-white">1</span>
                        <span className="text-sm lg:text-xl font-black text-amber-950 bg-white/90 px-3 py-1 rounded-full mt-1">{sortedStudents[0].score}m</span>
                      </div>
                    </div>

                    <div className="flex flex-col items-center flex-1">
                      <span className="text-base lg:text-xl font-black text-slate-700 mb-1">{sortedStudents[2].name}</span>
                      <div className="bg-gradient-to-b from-amber-600 to-amber-800 w-full h-16 lg:h-24 rounded-t-2xl border-2 border-amber-500 flex flex-col items-center justify-center shadow-lg relative">
                        <span className="text-2xl lg:text-4xl font-black text-white">3</span>
                        <span className="text-[10px] lg:text-sm font-bold text-amber-100 bg-amber-950/60 px-2 py-1 rounded-full mt-1">{sortedStudents[2].score}m</span>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2 w-full bg-slate-50 p-2 lg:p-4 rounded-xl mb-4 border-2 border-slate-200">
                    {sortedStudents.slice(3).map((st, i) => (
                      <div key={st.id} className="flex items-center justify-between bg-white px-2 py-1 lg:py-2 rounded-lg border border-slate-200 font-bold text-slate-600 text-xs lg:text-base">
                        <span>#{i + 4} {st.name}</span>
                        <span className="text-orange-500 font-black">{st.score}m</span>
                      </div>
                    ))}
                  </div>

                  <button 
                    onPointerDown={withInstantTouch(startGame)}
                    className="bg-blue-500 text-white text-xl lg:text-2xl font-black py-3 px-8 rounded-full shadow-[0_4px_0_0_rgba(29,78,216,1)] active:shadow-none active:translate-y-1 flex items-center gap-2 border-2 border-blue-300 touch-manipulation"
                  >
                    <Icon d={ICONS.rotateCcw} className="w-6 h-6 lg:w-8 lg:h-8" /> MAIN SEMULA
                  </button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
