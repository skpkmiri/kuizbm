  <script>
    class BackgroundMusic {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.timer = null;
      }
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
      play() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.isPlaying = true;
        
        const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // Melodi ceria
        let step = 0;

        const playNextNote = () => {
          if (!this.isPlaying) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(notes[step % notes.length], this.ctx.currentTime);
          gain.gain.setValueAtTime(0, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.05, this.ctx.currentTime + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.6);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.6);
          step = (step + Math.floor(Math.random() * 2) + 1) % notes.length;
          this.timer = setTimeout(playNextNote, 400);
        };
        playNextNote();
      }
      stop() {
        this.isPlaying = false;
        if (this.timer) clearTimeout(this.timer);
      }
    }
    window.bgMusic = new BackgroundMusic();
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_STUDENTS = [
      { id: 1, name: 'Shakeel', score: 0, history: [] },
      { id: 2, name: 'Aiman', score: 0, history: [] },
      { id: 3, name: 'Athena', score: 0, history: [] },
      { id: 4, name: 'Zaim', score: 0, history: [] },
      { id: 5, name: 'Alex', score: 0, history: [] },
      { id: 6, name: 'Natalie', score: 0, history: [] }
    ];

    // SENARAI 15 PERKATAAN DIKEMAS KINI (Diduplikasi untuk Kiri & Kanan)
    const BASE_WORDS = [
      { word: "BOLA", image: "bola.png" },
      { word: "BUKU", image: "buku.png" },
      { word: "LORI", image: "lori.png" },
      { word: "BAJU", image: "baju.png" },
      { word: "ROTI", image: "roti.png" },
      { word: "PASU", image: "pasu.png" },
      { word: "KATAK", image: "katak.png" },
      { word: "BOTOL", image: "botol.png" },
      { word: "KEK", image: "kek.png" },
      { word: "GIGI", image: "gigi.png" },
      { word: "MATA", image: "mata.png" },
      { word: "PENSEL", image: "pensel.png" },
      { word: "BEG", image: "beg.png" },
      { word: "TIKUS", image: "tikus.png" },
      { word: "BIRU", image: "biru.png" }
    ];

    const WORDS_P1 = [...BASE_WORDS]; // 15 soalan Kiri
    const WORDS_P2 = [...BASE_WORDS]; // 15 soalan Kanan (Set yang sama)

    const P1_STUDENT_INDICES = [0, 2, 4]; // Kiri: Shakeel, Athena, Alex
    const P2_STUDENT_INDICES = [1, 3, 5]; // Kanan: Aiman, Zaim, Natalie

    const TIME_PER_TURN = 60; 

    function App() {
      const [gameState, setGameState] = useState('start'); 
      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [musicOn, setMusicOn] = useState(true);

      const [p1State, setP1State] = useState({ 
        studentIdxInList: 0, wordIdx: 0, timeLeft: TIME_PER_TURN, input: '', feedback: null, isFinished: false 
      });

      const [p2State, setP2State] = useState({ 
        studentIdxInList: 0, wordIdx: 0, timeLeft: TIME_PER_TURN, input: '', feedback: null, isFinished: false 
      });

      useEffect(() => {
        if (window.lucide) { window.lucide.createIcons(); }
      });

      const toggleMusic = () => {
        if (musicOn) { window.bgMusic.stop(); setMusicOn(false); } 
        else { window.bgMusic.play(); setMusicOn(true); }
      };

      useEffect(() => {
        let timer;
        if (gameState === 'playing') {
          timer = setInterval(() => {
            setP1State(prev => {
              if (prev.isFinished || prev.feedback !== null) return prev;
              if (prev.timeLeft > 0) return { ...prev, timeLeft: prev.timeLeft - 1 };
              return prev;
            });
            setP2State(prev => {
              if (prev.isFinished || prev.feedback !== null) return prev;
              if (prev.timeLeft > 0) return { ...prev, timeLeft: prev.timeLeft - 1 };
              return prev;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [gameState]);

      useEffect(() => {
        if (gameState === 'playing') {
          if (p1State.timeLeft === 0 && p1State.feedback === null && !p1State.isFinished) handleAnswer('p1', true);
          if (p2State.timeLeft === 0 && p2State.feedback === null && !p2State.isFinished) handleAnswer('p2', true);
        }
      }, [p1State.timeLeft, p1State.feedback, p1State.isFinished, p2State.timeLeft, p2State.feedback, p2State.isFinished, gameState]);

      useEffect(() => {
        if (gameState === 'playing' && p1State.isFinished && p2State.isFinished) {
          setTimeout(() => { setGameState('ended'); }, 1500);
        }
      }, [p1State.isFinished, p2State.isFinished, gameState]);

      const startGame = () => {
        setStudents(INITIAL_STUDENTS.map(s => ({ ...s, score: 0, history: [] })));
        setP1State({ studentIdxInList: 0, wordIdx: 0, timeLeft: TIME_PER_TURN, input: '', feedback: null, isFinished: false });
        setP2State({ studentIdxInList: 0, wordIdx: 0, timeLeft: TIME_PER_TURN, input: '', feedback: null, isFinished: false });
        setGameState('playing');
        if (musicOn) window.bgMusic.play();
      };

      const goHome = () => { window.bgMusic.stop(); window.location.href = 'index.html'; };
      const forceEndGame = () => { setGameState('ended'); };

      const speakWord = (text) => {
        if ('speechSynthesis' in window) {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'ms-MY'; utterance.rate = 0.8;
          window.speechSynthesis.speak(utterance);
        }
      };

      const handleKeyPress = (player, key) => {
        const setState = player === 'p1' ? setP1State : setP2State;
        const currentState = player === 'p1' ? p1State : p2State;
        if (currentState.feedback !== null || currentState.isFinished) return;
        setState(prev => ({
          ...prev,
          input: key === 'PADAM' ? prev.input.slice(0, -1) : prev.input + key
        }));
      };

      const handleAnswer = (player, isTimeout = false) => {
        const isP1 = player === 'p1';
        const state = isP1 ? p1State : p2State;
        
        if (state.feedback !== null || state.isFinished) return;

        const studentGlobalIdx = isP1 ? P1_STUDENT_INDICES[state.studentIdxInList] : P2_STUDENT_INDICES[state.studentIdxInList];
        const wordList = isP1 ? WORDS_P1 : WORDS_P2;
        const wordObj = wordList[state.wordIdx];
        
        let isCorrect = false;
        if (!isTimeout) {
          isCorrect = state.input.trim().toLowerCase() === wordObj.word.toLowerCase();
        }
        
        setStudents(prev => {
          const newStudents = [...prev];
          newStudents[studentGlobalIdx] = {
            ...newStudents[studentGlobalIdx],
            score: isCorrect ? newStudents[studentGlobalIdx].score + 2 : newStudents[studentGlobalIdx].score,
            history: [...newStudents[studentGlobalIdx].history, isCorrect ? 2 : 'X']
          };
          return newStudents;
        });

        const feedbackVal = isTimeout ? 'timeout' : (isCorrect ? 'correct' : 'wrong');
        const setLocalState = isP1 ? setP1State : setP2State;
        
        setLocalState(prev => ({ ...prev, feedback: feedbackVal }));

        setTimeout(() => {
          setLocalState(prev => {
            const nextWordIdx = prev.wordIdx + 1;
            if (nextWordIdx >= 15) { return { ...prev, isFinished: true, feedback: null }; }
            return { ...prev, wordIdx: nextWordIdx, studentIdxInList: (prev.studentIdxInList + 1) % 3, timeLeft: TIME_PER_TURN, input: '', feedback: null };
          });
        }, 3000);
      };

      const renderKeyboard = (player, teamName) => {
        const state = player === 'p1' ? p1State : p2State;
        const isDisabled = state.feedback !== null || state.isFinished;
        const row1 = ['Q','W','E','R','T','Y','U','I','O','P'];
        const row2 = ['A','S','D','F','G','H','J','K','L'];
        const row3 = ['Z','X','C','V','B','N','M'];

        // Warna Butang Mainan (Chunky)
        const btnBaseClass = "bg-white border-b-[4px] lg:border-b-[6px] text-slate-700 font-bold text-sm lg:text-xl rounded-xl w-7 h-9 lg:w-12 lg:h-12 flex items-center justify-center transition-all disabled:opacity-50 active:border-b-0 active:translate-y-1 lg:active:translate-y-1.5";
        const btnColorHover = teamName === 'p1' ? "border-slate-300 hover:bg-sky-100 hover:border-sky-400 hover:text-sky-700" : "border-slate-300 hover:bg-pink-100 hover:border-pink-400 hover:text-pink-700";

        return (
          <div className="w-full flex flex-col gap-1 lg:gap-2 mb-1 lg:mb-2 relative z-10">
            <div className="flex justify-center gap-1 lg:gap-2">
              {row1.map(k => (
                <button key={k} type="button" disabled={isDisabled} onClick={() => handleKeyPress(player, k)} className={`${btnBaseClass} ${btnColorHover}`}>{k}</button>
              ))}
            </div>
            <div className="flex justify-center gap-1 lg:gap-2">
              {row2.map(k => (
                <button key={k} type="button" disabled={isDisabled} onClick={() => handleKeyPress(player, k)} className={`${btnBaseClass} ${btnColorHover}`}>{k}</button>
              ))}
            </div>
            <div className="flex justify-center gap-1 lg:gap-2">
              {row3.map(k => (
                <button key={k} type="button" disabled={isDisabled} onClick={() => handleKeyPress(player, k)} className={`${btnBaseClass} ${btnColorHover}`}>{k}</button>
              ))}
              <button type="button" disabled={isDisabled} onClick={() => handleKeyPress(player, 'PADAM')} className="bg-red-50 border-b-[4px] lg:border-b-[6px] border-red-300 text-red-500 font-bold rounded-xl px-2 lg:px-4 h-9 lg:h-12 flex items-center justify-center transition-all hover:bg-red-100 active:border-b-0 active:translate-y-1 disabled:opacity-50">
                <i data-lucide="delete" className="w-5 h-5 lg:w-6 lg:h-6"></i>
              </button>
            </div>
          </div>
        );
      };

      const renderTimerBar = (timeLeft, colorTheme) => {
        const timerPercentage = (timeLeft / TIME_PER_TURN) * 100;
        let barColor = colorTheme === 'blue' ? 'bg-sky-400' : 'bg-pink-400';
        let iconColor = colorTheme === 'blue' ? 'text-sky-500' : 'text-pink-500';
        
        if (timeLeft <= 15) barColor = 'bg-yellow-400';
        if (timeLeft <= 5) { barColor = 'bg-red-500'; iconColor = 'text-red-500 animate-bounce'; }
        
        return (
          <div className="flex items-center gap-2 mb-2 lg:mb-4 bg-white/70 backdrop-blur-sm p-1.5 lg:p-2 rounded-2xl border-4 border-white w-full shadow-sm relative z-10">
            <i data-lucide="clock" className={`w-6 h-6 lg:w-8 lg:h-8 ${iconColor} fill-white`}></i>
            <div className="flex-1 bg-slate-100 h-5 lg:h-6 rounded-xl overflow-hidden shadow-inner border-2 border-slate-200">
              <div className={`h-full transition-all duration-1000 ease-linear ${barColor} bg-stripes rounded-xl`} style={{ width: `${timerPercentage}%` }} />
            </div>
            <span className="font-black text-slate-700 w-12 text-center text-md lg:text-xl">{timeLeft}s</span>
          </div>
        );
      };

      const activeStudent1 = students[P1_STUDENT_INDICES[p1State.studentIdxInList]];
      const activeStudent2 = students[P2_STUDENT_INDICES[p2State.studentIdxInList]];
      const word1 = WORDS_P1[p1State.wordIdx] || WORDS_P1[0];
      const word2 = WORDS_P2[p2State.wordIdx] || WORDS_P2[0];
      const sortedStudents = [...students].sort((a, b) => b.score - a.score);

      return (
        <div className="w-full h-full flex flex-col relative p-2 lg:p-4 overflow-hidden z-10">
          
          {/* HEADER CERIA */}

            <div className="w-28 lg:w-36 flex items-center gap-2">
              {gameState !== 'start' && (
                <button onClick={goHome} className="bg-sky-400 hover:bg-sky-300 text-white p-2.5 rounded-2xl transition transform hover:scale-105 active:scale-95 flex items-center justify-center border-b-4 border-sky-600 shadow-sm" title="Utama">
                  <i data-lucide="home" className="w-6 h-6 lg:w-7 lg:h-7 fill-current"></i>
                </button>
              )}
              <button onClick={toggleMusic} className="bg-purple-400 hover:bg-purple-300 text-white p-2.5 rounded-2xl border-b-4 border-purple-600 shadow-sm transition transform hover:scale-105 active:scale-95" title="Muzik">
                <i data-lucide={musicOn ? "volume-2" : "volume-x"} className="w-6 h-6 lg:w-7 lg:h-7 fill-current"></i>
              </button>
            </div>
            
            <h1 className="text-2xl lg:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-orange-500 via-pink-500 to-purple-600 tracking-wider flex items-center justify-center gap-3 flex-1 drop-shadow-sm">
              <span className="animate-wiggle text-3xl lg:text-5xl">🎨</span>
              KUIZ EJAAN CERIA
              <span className="animate-wiggle text-3xl lg:text-5xl" style={{animationDelay: '1s'}}>🎈</span>
            </h1>

            <div className="w-28 lg:w-36 flex justify-end">
              {gameState === 'playing' && (
                <button onClick={forceEndGame} className="bg-red-500 hover:bg-red-400 text-white px-4 py-2 rounded-2xl transition transform hover:scale-105 active:translate-y-1 active:border-b-0 flex items-center justify-center border-b-4 border-red-700 font-bold text-sm lg:text-base gap-2 shadow-sm">
                  <i data-lucide="stop-circle" className="w-5 h-5 lg:w-6 lg:h-6 fill-current"></i> TAMAT
                </button>
              )}
            </div>
          </header>

          <div className="flex-1 w-full flex flex-row gap-3 overflow-hidden relative">
            
            {}
            {gameState === 'start' && (
              <div className="w-full bg-white/95 rounded-[3rem] shadow-[0_12px_0_0_rgba(255,255,255,0.5)] border-8 border-yellow-300 h-full flex flex-col justify-center items-center p-4 lg:p-8 text-center absolute inset-0 z-20 overflow-hidden">
                <div className="absolute top-10 left-20 text-6xl animate-wiggle">🦄</div>
                <div className="absolute bottom-10 right-20 text-6xl animate-bounce">🚀</div>
                <div className="absolute top-20 right-32 text-5xl animate-float">🌟</div>
                <div className="absolute bottom-20 left-32 text-5xl animate-float" style={{animationDelay: '1s'}}>🍕</div>

                <div className="flex gap-6 mb-4 animate-bounce">
                  <div className="bg-blue-100 p-4 rounded-full border-4 border-blue-300 shadow-md"><span className="text-[60px] lg:text-[80px] leading-none">👦</span></div>
                  <div className="bg-pink-100 p-4 rounded-full border-4 border-pink-300 shadow-md"><span className="text-[60px] lg:text-[80px] leading-none">👧</span></div>
                </div>

                <div className="bg-slate-50 border-4 border-slate-200 rounded-3xl p-6 mb-8 max-w-2xl shadow-inner relative">

                    Kumpulan Kiri: <span className="text-sky-500 bg-sky-100 px-3 py-1 rounded-xl">Shakeel, Athena, Alex</span><br/><br/>
                    Kumpulan Kanan: <span className="text-pink-500 bg-pink-100 px-3 py-1 rounded-xl">Aiman, Zaim, Natalie</span><br/><br/>
                    <span className="text-orange-500 bg-orange-100 px-4 py-2 rounded-full border-2 border-orange-300 flex items-center justify-center gap-2 w-max mx-auto mt-2">
                        <i data-lucide="clock" className="w-6 h-6"></i> 60 saat / soalan
                    </span>
                    </p>
                </div>

                <button onClick={startGame} className="bg-green-500 hover:bg-green-400 text-white text-2xl lg:text-4xl font-black py-4 px-12 rounded-[2rem] shadow-[0_8px_0_0_#15803d] active:shadow-none active:translate-y-2 transition flex items-center gap-3 border-4 border-green-300 z-10">
                  <i data-lucide="play" className="w-8 h-8 lg:w-10 lg:h-10 fill-current"></i> MULA SEKARANG!
                </button>
              </div>
            )}

            {}

              <>

                  {p1State.isFinished ? (
                    <div className="flex-1 flex flex-col items-center justify-center text-center animate-pulse">
                      <div className="bg-sky-100 p-6 rounded-full mb-4 border-4 border-sky-400 shadow-md"><i data-lucide="check" className="w-20 h-20 text-sky-500" strokeWidth={4}></i></div>
                      <h2 className="text-4xl font-black text-sky-600 mb-2">SIAP!</h2>
                      <p className="text-lg font-bold text-slate-500 bg-white/50 px-4 py-2 rounded-full">Tunggu rakan sebelah...</p>
                    </div>
                  ) : (
                    <>

                      {p1State.feedback && (
                        <div className={`absolute inset-0 z-50 flex flex-col items-center justify-center backdrop-blur-md bg-white/80 rounded-[2rem]
                          ${p1State.feedback === 'correct' ? 'text-green-500' : 'text-red-500'}`}>
                          {p1State.feedback === 'correct' ? (
                            <div className="flex flex-col items-center animate-bounce">
                              <div className="bg-green-100 p-6 rounded-full mb-2 border-4 border-green-400 shadow-lg"><span className="text-6xl">🌟</span></div>
                              <h2 className="text-5xl font-black mb-1 drop-shadow-md">PANDAI!</h2>
                              <p className="text-2xl font-black bg-green-500 text-white px-6 py-2 rounded-full border-4 border-green-300 shadow-md">+2 Markah</p>
                            </div>
                          ) : p1State.feedback === 'timeout' ? (
                            <div className="flex flex-col items-center animate-wiggle">
                              <div className="bg-orange-100 p-6 rounded-full mb-2 border-4 border-orange-400 shadow-lg"><span className="text-6xl">⏰</span></div>
                              <h2 className="text-4xl font-black mb-2 text-orange-500 drop-shadow-md">ALAMAK, MASA TAMAT!</h2>
                              <div className="bg-white p-4 rounded-3xl border-4 border-dashed border-orange-300 shadow-md">
                                <p className="text-xl font-bold text-slate-500 mb-1">Jawapan:</p>
                                <p className="text-sky-600 text-4xl font-black">{word1.word}</p>
                              </div>
                            </div>
                          ) : (
                            <div className="flex flex-col items-center animate-wiggle">
                              <div className="bg-red-100 p-6 rounded-full mb-2 border-4 border-red-400 shadow-lg"><span className="text-6xl">❌</span></div>
                              <h2 className="text-4xl font-black mb-2 drop-shadow-md">CUBA LAGI!</h2>
                              <div className="bg-white p-4 rounded-3xl border-4 border-dashed border-red-300 shadow-md">
                                <p className="text-xl font-bold text-slate-500 mb-1">Jawapan:</p>
                                <p className="text-sky-600 text-4xl font-black">{word1.word}</p>
                              </div>
                            </div>
                          )}
                        </div>
                      )}

                      {renderTimerBar(p1State.timeLeft, 'blue')}

                      <div className="flex-1 flex flex-col items-center justify-start w-full relative z-10">
                        <div className="w-full flex justify-between items-center mb-1 gap-2">
                           <span className="bg-white border-2 border-sky-300 text-sky-700 px-4 py-2 rounded-2xl font-black shadow-sm text-sm lg:text-base">
                             SOALAN: {p1State.wordIdx + 1}/15
                           </span>
                           <div className="bg-sky-500 text-white px-6 py-2 rounded-2xl font-black text-xl lg:text-2xl flex-1 text-center border-b-4 border-sky-700 shadow-sm">
                              {activeStudent1.name}
                           </div>
                        </div>
                        
                        {/* Kotak Gambar Ala Polaroid */}
                        <div className="bg-white border-4 lg:border-[6px] border-sky-300 rounded-[2rem] p-3 my-2 shadow-[0_4px_0_0_#7dd3fc] flex items-center justify-center h-28 lg:h-36 w-[80%] mx-auto transform -rotate-1 hover:rotate-0 transition-transform">
                          <img src={word1.image} alt={word1.word} className="max-h-full max-w-full object-contain drop-shadow-md" onError={(e) => { e.target.onerror = null; e.target.src = `https://placehold.co/200x200/e0f2fe/0369a1?text=${word1.word}`; }} />
                        </div>

                        <button onClick={() => speakWord(word1.word)} className="bg-yellow-400 hover:bg-yellow-300 text-yellow-900 px-6 py-2 rounded-full text-base font-black shadow-[0_4px_0_0_#ca8a04] active:translate-y-1 active:shadow-none mb-3 flex items-center gap-2 border-4 border-yellow-200 transition-all">
                          <i data-lucide="volume-2" className="w-5 h-5 fill-current"></i> DENGAR
                        </button>

                        <input type="text" value={p1State.input} readOnly placeholder="EJA SINI..." className="w-full text-center text-3xl font-black py-2 lg:py-3 rounded-2xl border-[4px] border-sky-400 outline-none mb-2 lg:mb-3 uppercase tracking-widest text-sky-900 shadow-inner bg-white/90 placeholder-sky-300" />

                        {renderKeyboard('p1', 'p1')}
                      </div>

                      <button onClick={() => handleAnswer('p1')} disabled={!p1State.input.trim() || p1State.feedback !== null} className="mt-auto w-full bg-green-500 disabled:bg-slate-300 disabled:border-b-0 disabled:shadow-none text-white text-2xl font-black py-3 rounded-2xl shadow-[0_6px_0_0_#15803d] active:shadow-none active:translate-y-1 active:border-b-0 border-b-4 border-green-700 transition-all z-10 relative">
                        HANTAR
                      </button>
                    </>
                  )}
                </div>

                {/* ----------------- PAPAN MARKAH (16%) - TEMA KUNING CERIA ----------------- */}
                <div className="w-[16%] bg-gradient-to-b from-yellow-50 to-yellow-200 rounded-[2.5rem] border-[8px] border-yellow-300 shadow-[0_8px_0_0_#fde047] p-2 flex flex-col items-center h-full relative overflow-hidden">
                  <div className="absolute top-2 right-2 text-2xl opacity-20">⭐</div>
                  <h2 className="text-xl font-black text-amber-700 mb-2 flex flex-col items-center gap-1 text-center w-full pb-2 border-b-4 border-yellow-300/50 relative z-10">
                    <span className="bg-yellow-400 p-2 rounded-full border-2 border-white shadow-sm"><i data-lucide="trophy" className="w-6 h-6 text-white fill-current"></i></span>
                    MARKAH
                  </h2>
                  
                  <div className="flex-1 w-full flex flex-col gap-2 overflow-y-auto custom-scrollbar pr-1 relative z-10">
                    {sortedStudents.map((student, index) => (
                      <div key={student.id} className={`bg-white rounded-2xl p-2 border-[3px] shadow-sm flex flex-col items-center justify-center text-center transition-all relative overflow-hidden
                        ${(student.id === activeStudent1.id && !p1State.isFinished) || (student.id === activeStudent2.id && !p2State.isFinished) ? 'border-orange-400 bg-orange-50 scale-105 shadow-md' : 'border-yellow-200 hover:scale-105'}`}>
                        {/* Riben Nombor */}
                        <div className={`absolute top-0 left-0 w-8 h-8 rounded-br-2xl flex items-center justify-center font-black text-white text-xs shadow-sm
                            ${index === 0 ? 'bg-yellow-400' : index === 1 ? 'bg-slate-400' : index === 2 ? 'bg-amber-600' : 'bg-slate-200 text-slate-500'}`}>
                            #{index + 1}
                        </div>
                        <span className="font-bold text-sm text-slate-700 mt-3">{student.name}</span>
                        <span className="font-black text-2xl text-orange-500">{student.score}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* ----------------- KUMPULAN KANAN (42%) - TEMA PINK CERIA ----------------- */}
                <div className="w-[42%] bg-gradient-to-b from-pink-50 to-pink-200 rounded-[2.5rem] border-[8px] border-pink-300 shadow-[0_8px_0_0_#f9a8d4] relative flex flex-col p-3 lg:p-4 overflow-hidden h-full">
                  <div className="absolute top-2 right-2 text-4xl opacity-20">🌸</div>
                  <div className="absolute bottom-2 left-2 text-4xl opacity-20">🦋</div>

                  {p2State.isFinished ? (
                    <div className="flex-1 flex flex-col items-center justify-center text-center animate-pulse">
                      <div className="bg-pink-100 p-6 rounded-full mb-4 border-4 border-pink-400 shadow-md"><i data-lucide="check" className="w-20 h-20 text-pink-500" strokeWidth={4}></i></div>
                      <h2 className="text-4xl font-black text-pink-600 mb-2">SIAP!</h2>
                      <p className="text-lg font-bold text-slate-500 bg-white/50 px-4 py-2 rounded-full">Tunggu rakan sebelah...</p>
                    </div>
                  ) : (
                    <>
                      {/* Maklum Balas Kanan */}
                      {p2State.feedback && (
                        <div className={`absolute inset-0 z-50 flex flex-col items-center justify-center backdrop-blur-md bg-white/80 rounded-[2rem]
                          ${p2State.feedback === 'correct' ? 'text-green-500' : 'text-red-500'}`}>
                          {p2State.feedback === 'correct' ? (
                            <div className="flex flex-col items-center animate-bounce">
                              <div className="bg-green-100 p-6 rounded-full mb-2 border-4 border-green-400 shadow-lg"><span className="text-6xl">🌟</span></div>
                              <h2 className="text-5xl font-black mb-1 drop-shadow-md">PANDAI!</h2>
                              <p className="text-2xl font-black bg-green-500 text-white px-6 py-2 rounded-full border-4 border-green-300 shadow-md">+2 Markah</p>
                            </div>
                          ) : p2State.feedback === 'timeout' ? (
                            <div className="flex flex-col items-center animate-wiggle">
                              <div className="bg-orange-100 p-6 rounded-full mb-2 border-4 border-orange-400 shadow-lg"><span className="text-6xl">⏰</span></div>
                              <h2 className="text-4xl font-black mb-2 text-orange-500 drop-shadow-md">ALAMAK, MASA TAMAT!</h2>
                              <div className="bg-white p-4 rounded-3xl border-4 border-dashed border-orange-300 shadow-md">
                                <p className="text-xl font-bold text-slate-500 mb-1">Jawapan:</p>
                                <p className="text-pink-600 text-4xl font-black">{word2.word}</p>
                              </div>
                            </div>
                          ) : (
                            <div className="flex flex-col items-center animate-wiggle">
                              <div className="bg-red-100 p-6 rounded-full mb-2 border-4 border-red-400 shadow-lg"><span className="text-6xl">❌</span></div>
                              <h2 className="text-4xl font-black mb-2 drop-shadow-md">CUBA LAGI!</h2>
                              <div className="bg-white p-4 rounded-3xl border-4 border-dashed border-red-300 shadow-md">
                                <p className="text-xl font-bold text-slate-500 mb-1">Jawapan:</p>
                                <p className="text-pink-600 text-4xl font-black">{word2.word}</p>
                              </div>
                            </div>
                          )}
                        </div>
                      )}

                      {renderTimerBar(p2State.timeLeft, 'pink')}

                      <div className="flex-1 flex flex-col items-center justify-start w-full relative z-10">
                        <div className="w-full flex justify-between items-center mb-1 gap-2">
                           <span className="bg-white border-2 border-pink-300 text-pink-700 px-4 py-2 rounded-2xl font-black shadow-sm text-sm lg:text-base">
                             SOALAN: {p2State.wordIdx + 1}/15
                           </span>
                           <div className="bg-pink-500 text-white px-6 py-2 rounded-2xl font-black text-xl lg:text-2xl flex-1 text-center border-b-4 border-pink-700 shadow-sm">
                              {activeStudent2.name}
                           </div>
                        </div>
                        
                        {/* Kotak Gambar Ala Polaroid */}
                        <div className="bg-white border-4 lg:border-[6px] border-pink-300 rounded-[2rem] p-3 my-2 shadow-[0_4px_0_0_#f9a8d4] flex items-center justify-center h-28 lg:h-36 w-[80%] mx-auto transform rotate-1 hover:rotate-0 transition-transform">
                          <img src={word2.image} alt={word2.word} className="max-h-full max-w-full object-contain drop-shadow-md" onError={(e) => { e.target.onerror = null; e.target.src = `https://placehold.co/200x200/fce7f3/be185d?text=${word2.word}`; }} />
                        </div>

                        <button onClick={() => speakWord(word2.word)} className="bg-yellow-400 hover:bg-yellow-300 text-yellow-900 px-6 py-2 rounded-full text-base font-black shadow-[0_4px_0_0_#ca8a04] active:translate-y-1 active:shadow-none mb-3 flex items-center gap-2 border-4 border-yellow-200 transition-all">
                          <i data-lucide="volume-2" className="w-5 h-5 fill-current"></i> DENGAR
                        </button>

                        <input type="text" value={p2State.input} readOnly placeholder="EJA SINI..." className="w-full text-center text-3xl font-black py-2 lg:py-3 rounded-2xl border-[4px] border-pink-400 outline-none mb-2 lg:mb-3 uppercase tracking-widest text-pink-900 shadow-inner bg-white/90 placeholder-pink-300" />

                        {renderKeyboard('p2', 'p2')}
                      </div>

                      <button onClick={() => handleAnswer('p2')} disabled={!p2State.input.trim() || p2State.feedback !== null} className="mt-auto w-full bg-green-500 disabled:bg-slate-300 disabled:border-b-0 disabled:shadow-none text-white text-2xl font-black py-3 rounded-2xl shadow-[0_6px_0_0_#15803d] active:shadow-none active:translate-y-1 active:border-b-0 border-b-4 border-green-700 transition-all z-10 relative">
                        HANTAR
                      </button>
                    </>
                  )}
                </div>
              </>
            )}

            {}
            {gameState === 'ended' && (
              <div className="w-full bg-white/95 rounded-[3rem] shadow-[0_12px_0_0_rgba(255,255,255,0.5)] border-8 border-yellow-300 h-full flex flex-col justify-center items-center p-4 lg:p-8 text-center absolute inset-0 z-20 overflow-y-auto">
                {/* Konfeti Hiasan */}
                <div className="absolute top-10 left-20 text-5xl animate-float">🎊</div>
                <div className="absolute top-20 right-20 text-6xl animate-wiggle">🎉</div>
                <div className="absolute bottom-10 left-32 text-5xl animate-bounce">🎈</div>
                
                <div className="z-10 flex flex-col items-center w-full max-w-4xl mt-4">
                  <h2 className="text-4xl lg:text-6xl font-black mb-10 text-transparent bg-clip-text bg-gradient-to-r from-orange-500 via-pink-500 to-purple-600 drop-shadow-sm flex items-center gap-4">
                    🏆 JUARA KUIZ 🏆
                  </h2>

                  {/* 3D Visual Podium Comel */}
                  <div className="flex justify-center items-end gap-2 lg:gap-6 mb-8 h-48 lg:h-56 w-full px-4">
                    {/* TEMPAT KE-2 */}
                    <div className="flex flex-col items-center flex-1 z-10">
                      <span className="text-lg lg:text-xl font-black text-slate-700 bg-white px-4 py-1 rounded-full border-2 border-slate-200 mb-2 shadow-sm">{sortedStudents[1].name}</span>
                      <div className="bg-gradient-to-b from-slate-100 to-slate-300 w-full h-24 lg:h-32 rounded-t-3xl border-t-8 border-x-4 border-slate-300 flex flex-col items-center justify-start pt-4 shadow-lg relative">
                        <span className="text-4xl lg:text-5xl font-black text-slate-400 drop-shadow-sm">2</span>
                        <div className="bg-white border-2 border-slate-300 px-3 py-1 rounded-full mt-2 font-black text-slate-600 text-sm shadow-inner">{sortedStudents[1].score}m</div>
                      </div>
                    </div>
                    {/* TEMPAT PERTAMA */}
                    <div className="flex flex-col items-center flex-1 z-20">
                      <div className="bg-yellow-100 p-3 rounded-full mb-2 animate-bounce border-4 border-yellow-400 shadow-md">
                        <i data-lucide="crown" className="w-10 h-10 lg:w-12 lg:h-12 text-yellow-500 fill-yellow-400"></i>
                      </div>
                      <span className="text-xl lg:text-2xl font-black text-amber-600 bg-yellow-50 px-5 py-1 rounded-full border-2 border-yellow-300 mb-2 shadow-sm">{sortedStudents[0].name}</span>
                      <div className="bg-gradient-to-b from-yellow-200 to-amber-400 w-full h-36 lg:h-44 rounded-t-3xl border-t-8 border-x-4 border-yellow-300 flex flex-col items-center justify-start pt-4 shadow-2xl relative">
                        <span className="text-5xl lg:text-6xl font-black text-yellow-100 drop-shadow-md">1</span>
                        <div className="bg-white border-2 border-amber-300 px-4 py-1.5 rounded-full mt-2 font-black text-amber-600 text-base shadow-inner">{sortedStudents[0].score}m</div>
                      </div>
                    </div>
                    {/* TEMPAT KE-3 */}
                    <div className="flex flex-col items-center flex-1 z-10">
                      <span className="text-lg lg:text-xl font-black text-slate-700 bg-white px-4 py-1 rounded-full border-2 border-slate-200 mb-2 shadow-sm">{sortedStudents[2].name}</span>
                      <div className="bg-gradient-to-b from-orange-200 to-orange-400 w-full h-20 lg:h-24 rounded-t-3xl border-t-8 border-x-4 border-orange-300 flex flex-col items-center justify-start pt-2 shadow-lg relative">
                        <span className="text-3xl lg:text-4xl font-black text-orange-100 drop-shadow-sm">3</span>
                        <div className="bg-white border-2 border-orange-300 px-3 py-1 rounded-full mt-1 font-black text-orange-600 text-sm shadow-inner">{sortedStudents[2].score}m</div>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3 w-full bg-slate-100 p-4 rounded-3xl mb-6 border-4 border-slate-200 shadow-inner">
                    {sortedStudents.slice(3).map((st, i) => (
                      <div key={st.id} className="flex items-center justify-between bg-white px-3 py-2 rounded-2xl border-2 border-slate-200 font-bold text-slate-600 text-sm lg:text-base shadow-sm">
                        <span>#{i + 4} {st.name}</span>
                        <span className="text-orange-500 font-black bg-orange-50 px-2 py-0.5 rounded-lg border border-orange-200">{st.score}m</span>
                      </div>
                    ))}
                  </div>

                  <button onClick={startGame} className="bg-blue-500 hover:bg-blue-400 text-white text-xl lg:text-3xl font-black py-4 px-10 rounded-[2rem] shadow-[0_8px_0_0_#1d4ed8] active:translate-y-2 active:shadow-none active:border-b-0 flex items-center gap-3 border-4 border-blue-300 border-b-8 transition-all">
                    <i data-lucide="rotate-ccw" className="w-8 h-8 fill-current"></i> MAIN SEMULA
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
